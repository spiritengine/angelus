inputs:
  source: scheduled/reminders
handler:
  kind: python
  path: triagers/handlers/reminder.py
metadata:
  # Reminders batch into the daily `reminders` digest. That pipe renders ONLY
  # findings_since_last_drain (modelled on the `seeds` pipe), NOT the ops
  # `daily` pipe -- a reminder is a one-shot, and `daily` additionally renders
  # open_incidents, so routing reminders there would re-show every fired reminder
  # in every future digest (its catalog incident stays open; reminders never
  # clear).
  #
  # A store-corruption observation (a possibly-lost reminder = a missed deadline)
  # ALSO routes to `urgent_pipe`, jumping the daily queue while `reminders` stays
  # a never-drop floor -- see the handler's _route. Both target_pipe and
  # urgent_pipe are cross-ref validated at load (a typo fails the config --
  # finding-20260619-dle0), with the handler floor as defense-in-depth beneath
  # that. clearance_pipe is omitted: reminders fire once and retire, never clear.
  target_pipe: reminders
  urgent_pipe: now
