[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angelus"
version = "0.1.0"
description = "Scheduling, consolidation, and escalation spine for autonomous agent work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler",
    "click",
    "httpx",
    "jinja2",
    "pyyaml",
    "watchdog",
]

[project.scripts]
angelus = "angelus.cli:main"

[tool.setuptools.packages.find]
include = ["angelus*"]

# Ship the SQL migrations as package data. They live in angelus/migrations/
# (a data subdir, not a package) and the daemon resolves them package-relative
# at runtime, so they MUST travel inside the wheel -- a non-editable install
# that omitted them crash-loops at startup (finding-20260613-mbfc).
[tool.setuptools.package-data]
angelus = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "slow: marks tests that build/install a wheel (deselect with '-m \"not slow\"'); runs by default",
]
